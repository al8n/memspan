name: probe-sweep

# Times the scalar-probe width of each x86 SIMD backend against the plain
# scalar loop, and reports a table. The table itself is exploratory; whether
# the shipped width is still the narrow one is checked elsewhere, and by
# something much smaller — see "What is checked and what is not" below.
#
# # Why this exists
#
# Every ASCII-class kernel opens by scalar-classifying its first chunk so a
# short run never pays for a vector load. That probe scans a slice of
# compile-time-constant length, so LLVM unrolls it and rebuilds each copy as a
# short-circuit branch tree; when a caller's run lengths vary — which is what
# lexing is — it enters a different copy on every call and mispredicts in all
# of them. A measured sweep on aarch64 (#13) found a three-term predicate
# running at 1.9x a plain scalar loop, and halving the NEON probe recovered it.
#
# The SSE4.2, AVX2 and AVX-512 kernels all probed a full chunk — 16, 32 and 64
# bytes — so the same defect was structurally present and probably worse, and
# nobody had timed it, because the maintainer's host is aarch64.
#
# This workflow has since timed the two x86 tiers, and both now ship a probe of
# 8: on AVX2 that is the only measured width that puts `skip_ident` back under
# the scalar loop, and on SSE4.2 the only one that does so for
# `skip_ident_start`. AVX-512 is unchanged at 64, because the leg that would
# measure it has never actually run — see the AVX-512 section below. The sweep
# still compares each shipped width against its neighbours, so a host that has
# the hardware can revisit any of the three.
#
# # What is checked and what is not
#
# **This sweep does not judge a timing, and `ci/probe_sweep.py` passes no
# judgement on one.** There is nothing here to judge *against*: a sweep has no
# before and no after, only a set of widths, so any pass/fail threshold on its
# own numbers would be invented rather than measured. It is also expensive —
# one build and two timed rounds per width per tier — and a multi-minute perf
# comparison attached to every push is a check people learn to bypass, which is
# worse than an honest scheduled job. So this job renders a table and uploads
# the raw criterion estimates, marks no winner, applies no threshold, and
# leaves the choice of width to whoever reads it.
#
# **Whether the shipped probe is still narrow is checked, on every pull
# request, by the `probe-width` job in `.github/workflows/ci.yml`.** It reads
# the constants: `CLASS_PROBE` is a compile-time constant per backend, so a
# revert is a source-level fact, and `ci/check_probe_width.py` holds each
# backend's declaration against the width this crate intends. No hardware, no
# runner and no threshold enter into it — including for NEON and wasm
# `simd128`, which no timing job here or in `ci.yml` can reach.
#
# The `probe-timing` job in `ci.yml` still times the shipped width on both x86
# tiers of every pull request, and **reports rather than decides**: it prints
# each round, the median and a reference line derived from the sweep's own
# shipped and chunk-width measurements, annotates a row that goes over, and
# does not fail on one. It failed on one until the third review round, when the
# band it enforced turned out to depend on which CPU model GitHub allocated;
# `ci/report_probe_timing.py` records that reasoning.
#
# **Nothing checks scalar parity, here or there.** SSE4.2 `skip_ident` measures
# 1.18 at the shipped width and AVX2 `skip_ident_start` 1.11; those are the best
# configurations this sweep found, so a threshold at 1.00 would reject correct
# code. Every reference line sits above parity by construction and certifies
# nothing about it.
#
# **A red check does not stop a merge.** This repository has no branch
# protection rule and no ruleset, so a failing `probe-width` is visible on the
# pull request and a maintainer can still merge or push directly past it.
#
# **Nothing at all covers AVX-512 or wasm `simd128`, and that is a statement
# rather than an omission.** No hosted runner has AVX-512, no workflow times
# `simd128`, and no threshold can be applied to a measurement that does not
# exist. Those two backends are guarded by review.
#
# This job does fail, loudly, on anything structural: a swept scanner that the
# backend does not generate with `skip_ascii_class!` and so cannot respond to
# the constant, an expected class x probe x round result that is absent, a
# matrix `default_probe` that no longer matches the shipped constant, or a tier
# that finished having measured nothing. A reporter that silently drops a row,
# and a leg that silently measures nothing, both look exactly like a clean run.
#
# # Why the bench filter is `lexer_sweep` and not the whole bench
#
# `CLASS_PROBE` sizes the scalar probe inside `skip_ascii_class!` and nowhere
# else: `skip_while` and `skip_until` still probe a whole chunk. `short_run.rs`
# keeps those two in a separate `generic_sweep` group so they are outside both
# this filter — a row the constant cannot move is not evidence about it, however
# much work its scanner does.
#
# # Why AVX-512 is optional, and why SDE is not used to time it
#
# GitHub-hosted x86 runners are a mix of Intel Xeon (AVX-512 on some
# generations) and AMD EPYC (none), so the AVX-512 leg times its sweep only
# when the runner actually has AVX-512BW.
#
# It is the *only* leg allowed to finish without a measurement, and it says so
# in its own name. Every other tier carries `required_measurement: true` and
# fails when it produces no rendered summary, because SSE4.2 and AVX2 are on
# every hosted x86 runner and their absence is a broken job rather than an
# expected one. That distinction had to be made explicit: for the whole life of
# this workflow, a missing CPU flag skipped every step including the upload,
# and the leg exited green having measured nothing — which is why no AVX-512
# data has ever existed while the monthly run reported success. Absence was
# being reported as success. It now reports as absence, and only here.
#
# This repository already installs Intel SDE for the AVX-512 *correctness*
# suite, and it is tempting to reuse it here. Do not: SDE is a functional
# emulator, and its wall-clock numbers describe the emulator, not the CPU. A
# sweep timed under SDE would yield a confident table of meaningless ratios.
#
# SDE's `-mix` dynamic instruction and branch counts were considered as a
# noise-free proxy and rejected on a specific ground rather than on effort: the
# cost being measured is branch *misprediction*, which a static count cannot
# see, and for the short-run population that this whole investigation is about
# the counts barely move. Both a 64-byte and an 8-byte probe exit after roughly
# three bytes on a three-byte run, so the dynamic branch count would shift by a
# few percent on a corpus where the *time* shifted by 45%. A number that small
# reads as "no effect" and would argue against a change that is real. An
# honest gap beats a misleading metric.

on:
  workflow_dispatch:
    inputs:
      runner:
        description: >-
          Runner label. GitHub's shared x86 pool rarely offers AVX-512; point
          this at a runner that has it to fill in that leg.
        required: false
        default: ubuntu-latest
  schedule:
    - cron: "0 3 1 * *"

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  # Two rounds per width, run alternately, so a drift in runner load shows up
  # as a spread rather than as a fake winner.
  ROUNDS: 2

jobs:
  sweep:
    name: sweep-${{ matrix.tier }}${{ matrix.required_measurement && ' (must measure)' || ' (optional, needs AVX-512 hardware)' }}
    runs-on: ${{ github.event.inputs.runner || 'ubuntu-latest' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # `cpu_flag` is matched against /proc/cpuinfo. `isolate` pins the
          # dispatcher to this tier by disabling everything above it, so the
          # sweep measures the backend it claims to.
          #
          # `default_probe` must equal the `CLASS_PROBE` default that tier's
          # backend actually ships. The reporter labels that column "(shipped)"
          # and measures every gain against it, so a stale value here would
          # report gains against a width the crate no longer uses. It must also
          # be a member of `probes`, or the reporter cannot find its baseline.
          #
          # `required_measurement` says whether this leg is allowed to finish
          # having timed nothing. Only AVX-512 is, and only because no hosted
          # runner has the hardware.
          #
          # None of these is enforced by being written here.
          # `ci/check_probe_matrix.py` holds `default_probe` against the
          # constant in `src/skip/<tier>.rs`; derives `isolate` from the
          # dispatcher's tier order, so a flag that is missing, extra or
          # misspelt fails even when `probe-timing` in `ci.yml` has the same
          # mistake; and is what `require-measurements` reads to learn which
          # tiers must measure, so that list is a single source rather than a
          # third copy. It runs below, and on every pull request from `ci.yml`.
          - tier: sse42
            cpu_flag: sse4_2
            default_probe: 8
            probes: "16,8,4"
            required_measurement: true
            isolate: --cfg memspan_disable_avx512 --cfg memspan_disable_avx2
          - tier: avx2
            cpu_flag: avx2
            default_probe: 8
            probes: "32,16,8,4"
            required_measurement: true
            isolate: --cfg memspan_disable_avx512
          - tier: avx512
            cpu_flag: avx512bw
            default_probe: 64
            probes: "64,32,16,8"
            required_measurement: false
            isolate: ""
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust
        run: rustup update stable && rustup default stable

      - name: Ensure PyYAML
        shell: bash
        run: python3 -c 'import yaml' || python3 -m pip install --break-system-packages --quiet pyyaml

      # The matrix restates three facts that live elsewhere. Checking them here
      # costs a second and stops the sweep before it spends twenty minutes
      # rendering a table whose "(shipped)" column, gain baseline and reach
      # threshold are all measured against a width the crate no longer uses.
      - name: Prove the matrix check bites
        run: python3 ci/check_probe_matrix.py --selftest

      - name: Check the matrix against the shipped constants
        run: python3 ci/check_probe_matrix.py

      # This run cannot exercise either of its own measurement assertions --
      # the hardware decides which branch executes, and a hosted runner only
      # ever takes the ones that pass. Drive both here instead.
      - name: Drive this job's measurement assertions through every state
        run: python3 ci/check_sweep_assertions.py

      # The reporter decides what gets published, so it is checked before it is
      # trusted. Its fixtures compare against literal expected rows written by
      # hand, never against output the reporter produced.
      - name: Check the reporter against its fixtures
        run: python3 ci/test_probe_sweep.py

      # A passing suite says nothing on its own; what matters is that it would
      # fail. This breaks the reporter five ways and requires each break to be
      # caught, asserting anchor uniqueness and a changed file hash first so a
      # mutation that silently fails to land cannot be read as coverage.
      - name: Check the fixtures actually bite
        run: python3 ci/check_fixtures_bite.py

      # The reporter makes no verdicts, and the reason is a measurement rather
      # than an opinion. This rederives it from the recorded data.
      - name: Check the no-verdict justification still holds
        run: python3 ci/check_uncertainty.py

      - name: Check whether this runner has ${{ matrix.tier }}
        id: cpu
        run: |
          if grep -qw "${{ matrix.cpu_flag }}" /proc/cpuinfo; then
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
          fi
          echo "model=$(grep -m1 'model name' /proc/cpuinfo | cut -d: -f2- | xargs)" >> "$GITHUB_OUTPUT"

      - name: Report that ${{ matrix.tier }} is unavailable
        if: steps.cpu.outputs.available != 'true'
        run: |
          {
            echo "### \`${{ matrix.tier }}\` not measured"
            echo
            echo "This runner is \`${{ steps.cpu.outputs.model }}\`, which does not"
            echo "report the \`${{ matrix.cpu_flag }}\` flag, so there is nothing to time."
            echo
            echo "This is expected for AVX-512 on GitHub's shared pool. Re-dispatch the"
            echo "workflow with a runner that has it to fill this leg in. The sweep is"
            echo "deliberately **not** run under Intel SDE: SDE is a functional emulator"
            echo "and its wall-clock output measures the emulator, not the CPU."
          } >> "$GITHUB_STEP_SUMMARY"

      # Each width needs its own build, and they must coexist so the rounds can
      # alternate between them instead of running all of one width and then all
      # of the next. Separate target dirs are how they coexist; criterion is
      # pointed at one shared home so every result lands in the same tree.
      - name: Build one bench binary per probe width
        if: steps.cpu.outputs.available == 'true'
        run: |
          for probe in $(echo "${{ matrix.probes }}" | tr ',' ' '); do
            echo "::group::build probe=$probe"
            CARGO_TARGET_DIR="$PWD/target-p$probe" \
            RUSTFLAGS="${{ matrix.isolate }} --cfg memspan_class_probe=\"$probe\"" \
              cargo bench --bench short_run --no-run
            echo "::endgroup::"
          done

      # Correctness first: a width that scans a different number of bytes must
      # still return the same answer. `tests/short_run_differential.rs` holds
      # every class against an independent scalar oracle.
      - name: Check every width still agrees with the oracle
        if: steps.cpu.outputs.available == 'true'
        run: |
          for probe in $(echo "${{ matrix.probes }}" | tr ',' ' '); do
            echo "::group::test probe=$probe"
            CARGO_TARGET_DIR="$PWD/target-p$probe" \
            RUSTFLAGS="${{ matrix.isolate }} --cfg memspan_class_probe=\"$probe\"" \
              cargo test --all-features --test short_run_differential
            echo "::endgroup::"
          done

      - name: Run the sweep
        if: steps.cpu.outputs.available == 'true'
        env:
          CRITERION_HOME: ${{ github.workspace }}/criterion-sweep
        run: |
          for round in $(seq 1 "$ROUNDS"); do
            for probe in $(echo "${{ matrix.probes }}" | tr ',' ' '); do
              echo "::group::round $round, probe=$probe"
              CARGO_TARGET_DIR="$PWD/target-p$probe" \
              RUSTFLAGS="${{ matrix.isolate }} --cfg memspan_class_probe=\"$probe\"" \
                cargo bench --bench short_run -- \
                  --warm-up-time 1 --measurement-time 2 --sample-size 100 \
                  --save-baseline "${probe}_r${round}" 'lexer_sweep'
              echo "::endgroup::"
            done
          done

      - name: Render the table
        if: steps.cpu.outputs.available == 'true'
        # `shell: bash` for `pipefail`, and it is load-bearing rather than
        # stylistic. The default Linux shell is `bash -e` *without* it, so in
        # `python3 ci/probe_sweep.py | tee ...` the pipeline takes `tee`'s exit
        # code and a reporter that called `die()` would have rendered its
        # failure message into the summary and passed the step. Every structural
        # refusal that script makes was unreachable through this pipe.
        shell: bash
        run: |
          {
            echo "CPU: \`${{ steps.cpu.outputs.model }}\`"
            echo
            python3 ci/probe_sweep.py \
              --criterion-home "${{ github.workspace }}/criterion-sweep" \
              --repo-root "${{ github.workspace }}" \
              --tier "${{ matrix.tier }}" \
              --default-probe "${{ matrix.default_probe }}" \
              --probes "${{ matrix.probes }}" \
              --rounds "$ROUNDS"
          } | tee "${{ github.workspace }}/criterion-sweep/summary-${{ matrix.tier }}.md"
          cat "${{ github.workspace }}/criterion-sweep/summary-${{ matrix.tier }}.md" >> "$GITHUB_STEP_SUMMARY"

      # An artifact that carries a conclusion must carry what licenses it.
      #
      # This used to upload `**/estimates.json` alone. Every reach claim in the
      # rendered table is licensed by `corpus-profile.json` — the histogram of
      # what each class's corpus actually made the scanner do — and that file
      # was not in the artifact, so anyone reading the artifact by itself saw
      # a reach column with no way to check whether a row's corpus could tell
      # the compared widths apart. That is the reporting gap this workflow
      # exists to close, reproduced one level out in its own output.
      #
      # The path is now the whole directory: the estimates, both corpus
      # profiles, and the rendered summary. A reader can re-derive every number
      # in the table from the artifact without access to the runner.
      - name: Upload the sweep, its corpus profiles, and the rendered summary
        if: steps.cpu.outputs.available == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: probe-sweep-${{ matrix.tier }}
          path: ${{ github.workspace }}/criterion-sweep
          if-no-files-found: error

      # Terminal assertion, and deliberately unconditional.
      #
      # Every step above is guarded by `available == 'true'`, and the defect
      # this closes is that when the guard was false *all* of them agreed to
      # skip — the build, the differential, the sweep, the render and the
      # upload — and the leg exited green having measured nothing. A check that
      # shared the guard would have skipped with them, so this one does not
      # consult the guard, the step outcomes, or anything else that was free to
      # agree with the others. It asks the filesystem, under `always()`, and so
      # runs when the guard is false and when an earlier step died.
      #
      # It requires the rendered heading, not merely a non-empty file. The
      # render pipes the reporter into `tee`, so a reporter that refused to
      # publish writes its refusal into the same path; a size check would read
      # that as a measurement.
      - name: Assert this tier produced a measurement
        if: always()
        shell: bash
        run: |
          summary="${{ github.workspace }}/criterion-sweep/summary-${{ matrix.tier }}.md"
          heading="### \`${{ matrix.tier }}\` probe-length sweep"

          if [ -f "$summary" ] && grep -qF "$heading" "$summary"; then
            echo "ok: ${{ matrix.tier }} rendered a table ($(wc -l < "$summary") lines)"
            exit 0
          fi

          if [ "${{ matrix.required_measurement }}" = "true" ]; then
            {
              echo "### \`${{ matrix.tier }}\` produced no measurement"
              echo
              echo "This leg carries \`required_measurement: true\` because every"
              echo "GitHub-hosted x86 runner has \`${{ matrix.cpu_flag }}\`, so a leg that"
              echo "measured nothing is a broken job and not an expected outcome."
              echo
              echo "No table was rendered to \`$summary\`. Either the CPU check found no"
              echo "\`${{ matrix.cpu_flag }}\` — check the runner label — or a step before the"
              echo "render failed, or the reporter refused to publish."
            } >> "$GITHUB_STEP_SUMMARY"
            echo "::error title=${{ matrix.tier }} measured nothing::no rendered table at $summary"
            exit 1
          fi

          {
            echo "### \`${{ matrix.tier }}\` not measured (optional leg)"
            echo
            echo "This is the one tier allowed to finish without a measurement, because"
            echo "GitHub's hosted pool does not offer AVX-512. **Read this leg's green"
            echo "tick as \"did not run\", not as \"passed\"**; \`require-measurements\`"
            echo "does not count it."
          } >> "$GITHUB_STEP_SUMMARY"
          echo "::warning title=${{ matrix.tier }} measured nothing::optional leg, no data produced"

  # One job whose green means "the tiers that had to measure, measured".
  #
  # The per-leg assertion above cannot say that on its own: it only runs if its
  # leg runs. A matrix entry deleted, a leg cancelled, or a job that never
  # started leaves nothing behind to assert anything, and the workflow is green
  # because no step failed. This job runs under `always()` after the whole
  # matrix and checks a different observable — the artifacts the run actually
  # has — against the list of tiers the matrix says must produce one.
  #
  # The expected list is read out of the matrix by the same script that checks
  # the matrix, rather than restated here. A hard-coded `sse42 avx2` would be a
  # third copy of a fact this workflow has already had go stale once.
  require-measurements:
    name: require-measurements
    needs: sweep
    if: always()
    runs-on: ubuntu-latest
    permissions:
      actions: read
    steps:
      - uses: actions/checkout@v7

      - name: Ensure PyYAML
        shell: bash
        run: python3 -c 'import yaml' || python3 -m pip install --break-system-packages --quiet pyyaml

      - name: Assert every tier that had to measure uploaded its sweep
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          required=$(python3 ci/check_probe_matrix.py --print-required-tiers)
          if [ -z "$required" ]; then
            echo "::error::the matrix names no tier that must measure"
            exit 1
          fi
          # `sed`, not `printf '  %s\n'`: these are multi-line strings, and
          # printf indents only the first line of one, which reads as a
          # one-element list and misdescribes the very thing being diagnosed.
          echo "tiers that must measure:"
          printf '%s\n' "$required" | sed 's/^/  /'

          artifacts=$(gh api --paginate \
            "repos/${{ github.repository }}/actions/runs/${{ github.run_id }}/artifacts" \
            --jq '.artifacts[].name')
          echo "artifacts this run produced:"
          printf '%s\n' "${artifacts:-<none>}" | sed 's/^/  /'

          missing=()
          for tier in $required; do
            if ! printf '%s\n' "$artifacts" | grep -qx "probe-sweep-$tier"; then
              missing+=("$tier")
            fi
          done

          if [ ${#missing[@]} -gt 0 ]; then
            {
              echo "### The sweep did not measure ${missing[*]}"
              echo
              echo "Those tiers carry \`required_measurement: true\` and uploaded no"
              echo "artifact, so this run produced no data for them. A green run with a"
              echo "tier missing is the failure mode this job exists to end: for the"
              echo "whole life of this workflow a missing CPU flag skipped every step"
              echo "including the upload, and the leg reported success."
            } >> "$GITHUB_STEP_SUMMARY"
            echo "::error title=required tiers measured nothing::${missing[*]}"
            exit 1
          fi

          # Checked last so the artifact report above is always printed: a
          # failed leg is more legible when you can also see what it did upload.
          if [ "${{ needs.sweep.result }}" != "success" ]; then
            echo "::error::the sweep matrix concluded '${{ needs.sweep.result }}'"
            exit 1
          fi

          echo "every required tier uploaded a sweep artifact"
