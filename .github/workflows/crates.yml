name: Crates.io

on:
  push:
    tags:
      - 'v*'
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    name: Verify crate release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install Rust
        run: |
          rustup update stable --no-self-update
          rustup default stable
      - name: Verify release version
        if: ${{ github.ref_type == 'tag' }}
        shell: bash
        run: |
          version=$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[] | select(.name == "memspan") | .version')
          expected="v${version}"
          if [[ "$GITHUB_REF_NAME" != "$expected" ]]; then
            echo "::error::tag ${GITHUB_REF_NAME} does not match memspan ${version}"
            exit 1
          fi
      - name: Run prepublish checks
        run: |
          cargo test --all-features
          cargo publish --dry-run

  publish:
    name: Publish crate
    if: ${{ github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v') }}
    needs: verify
    runs-on: ubuntu-latest
    environment: crates-io
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7
      - name: Install Rust
        run: |
          rustup update stable --no-self-update
          rustup default stable
      - name: Verify release version
        shell: bash
        run: |
          version=$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[] | select(.name == "memspan") | .version')
          expected="v${version}"
          if [[ "$GITHUB_REF_NAME" != "$expected" ]]; then
            echo "::error::tag ${GITHUB_REF_NAME} does not match memspan ${version}"
            exit 1
          fi
      - name: Authenticate with crates.io
        id: crates-io-auth
        uses: rust-lang/crates-io-auth-action@v1
      - name: Publish memspan
        run: cargo publish
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.crates-io-auth.outputs.token }}
