name: CI

on:
  push:
    branches:
      - main
    paths-ignore:
      - 'README'
      - 'COPYRIGHT'
      - 'LICENSE-*'
      - '**.md'
      - '**.txt'
  pull_request:
    paths-ignore:
      - 'README'
      - 'COPYRIGHT'
      - 'LICENSE-*'
      - '**.md'
      - '**.txt'
  workflow_dispatch:
  schedule:
    - cron: "0 1 1 * *"

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -Dwarnings
  RUST_BACKTRACE: 1

concurrency:
  # A new run on a branch cancels the old one; every commit on a trunk keeps its own verdict.
  #
  # Both halves are load-bearing. The sha enters the group key ONLY on a trunk, so each
  # trunk commit gets its own group; `cancel-in-progress: false` alone would not protect
  # it, because a run queued into a group that already holds one in progress cancels
  # whichever run was PENDING there regardless of that setting.
  #
  # The predicate names both `main` and `dev`: the trunk is `main` here, `dev` in pql and
  # painty. One identical block across every workflow in every repo -- the recorded failure
  # mode is a fix landing in one file and dying there. The unused name costs nothing.
  #
  # It keys on the REF, not on `github.event_name`. An event-keyed predicate leaves direct
  # pushes uncancelled, which is how these repositories accumulated a seventy-deep queue.
  group: ${{ github.workflow }}-${{ github.ref }}-${{ (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/dev') && github.sha || '' }}
  cancel-in-progress: ${{ !(github.ref == 'refs/heads/main' || github.ref == 'refs/heads/dev') }}

jobs:
  # Check formatting (platform-independent, one OS is enough)
  rustfmt:
    name: rustfmt
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7
    - name: Install Rust
      run: rustup update stable && rustup default stable && rustup component add rustfmt
    - name: Check formatting
      run: cargo fmt --all -- --check

  # The probe-sweep matrix restates the shipped `CLASS_PROBE` of each x86
  # backend, and `probe-timing` below restates that workflow's dispatcher
  # isolation flags. Neither restatement was enforced by anything, and one of
  # them had already gone stale: the matrix carried `default_probe: 16/32`
  # after the constants moved to `8`, which would have made every future sweep
  # report gains against a width the crate no longer ships, in a table that
  # looks exactly like a correct one.
  #
  # The same job also drives the sweep's two measurement assertions, which no
  # ordinary run can exercise: every hosted x86 runner has SSE4.2 and AVX2, so
  # their failing branch never executes, and none has AVX-512, so that leg's
  # passing branch never executes either. A green sweep is no evidence that
  # either assertion would fail when it should.
  #
  # Cheap enough to gate on: python only, no toolchain, a few seconds.
  sweep-guards:
    name: sweep-guards
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Ensure PyYAML
        shell: bash
        run: python3 -c 'import yaml' || python3 -m pip install --break-system-packages --quiet pyyaml
      - name: Prove the matrix check bites
        run: python3 ci/check_probe_matrix.py --selftest
      - name: Check the matrix against the shipped constants
        run: python3 ci/check_probe_matrix.py
      - name: Drive the sweep's measurement assertions through every state
        run: python3 ci/check_sweep_assertions.py

  # **The gate on the probe width.** `skip_ident` and `skip_ident_start` were
  # both slower through the SIMD scanner than through the plain scalar
  # `position` loop it replaces, on both x86 tiers, and narrowing `CLASS_PROBE`
  # to 8 is what fixed it. No test in this repository could fail if that were
  # reverted — the differential suite is a correctness oracle and passes at
  # every width by design — so the fix was protected by nothing but the commit
  # message.
  #
  # `CLASS_PROBE` is a compile-time constant per backend, so "has the narrowing
  # been reverted" is a question about the source, and this job answers it by
  # reading the source: no hardware, no runner, no benchmark, no band. It is
  # not a constant asserted against itself — the intended width per backend
  # lives in `ci/check_probe_width.py`, held against what each
  # `src/skip/<backend>.rs` declares, so a revert fails until someone edits the
  # table to say the crate now intends a chunk-width probe. It also refuses a
  # `build.rs` or `.cargo/config.toml` that would override the width for every
  # build behind the source's back.
  #
  # The timing job below used to make this call, from five benchmark rounds
  # against a band. That verdict was never sound: the bands were calibrated on
  # an AMD EPYC 7763, `ubuntu-latest` pins no CPU model, and a model shift moves
  # every round together — so a clean tree could fail on a slower host and a
  # reverted one pass on a faster one. It now reports and this job decides.
  #
  # **It reports a breach loudly; it does not stop a merge.** This repository
  # has no branch protection rule and no ruleset, so a red check here is
  # visible on the pull request and a maintainer can still merge or push
  # directly past it. Making it required is a repository setting; if that is
  # ever enabled this comment should say so, and it must never claim more than
  # the configuration delivers.
  #
  # Python only, no toolchain, a second or two.
  probe-width:
    name: probe-width
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # Run before the check itself, so a gate that cannot fail is caught even
      # on a run where the tree happens to be clean.
      - name: Prove the width check bites
        run: python3 ci/check_probe_width.py --selftest
      - name: Check every backend against its intended probe width
        shell: bash
        run: python3 ci/check_probe_width.py | tee -a "$GITHUB_STEP_SUMMARY"

  # **Evidence, not a verdict.** This job times the shipped width against the
  # plain scalar loop on both x86 tiers and prints what it measured. A ratio
  # over its reference line is annotated as a warning and **does not fail the
  # job**; `probe-width` above is what decides whether the probe is still
  # narrow, and it decides it from the source.
  #
  # Absence still fails. Every missing series, round or result set is an error
  # in `ci/report_probe_timing.py`, because a report that measures nothing and
  # exits 0 is the defect this repository already shipped once, in a sweep leg
  # whose every step was skipped by one shared condition.
  #
  # `runs-on: ubuntu-latest` selects a generic hosted x64 VM. It does **not**
  # pin the AMD EPYC 7763 the recorded observations came from, and nothing here
  # pretends otherwise: the CPU model is read off the runner and printed into
  # the report, so a reader can see what produced the numbers. That was a
  # defect while this job held a verdict, and is merely a caveat now that it
  # holds none.
  #
  # This is not the probe sweep. The sweep compares several widths, takes tens
  # of minutes, and cannot be attached to a push without becoming a check
  # people route around; see `.github/workflows/probe-sweep.yml`. This job
  # measures **only the shipped width**, which needs one build per tier and
  # five short rounds. Both series are timed in the same process on the same
  # corpus, so the ratio carries no dependence on runner speed or on a stored
  # baseline.
  probe-timing:
    name: probe-timing-${{ matrix.tier }}
    runs-on: ubuntu-latest
    env:
      # One number, read by the bench loop and by the report below, so the
      # count of rounds written and the count required cannot drift apart. Five
      # and not two: the statistic is the median, three of five rounds have to
      # agree to move it, and an even count makes the median the mean of the
      # middle pair. See `ci/report_probe_timing.py`.
      ROUNDS: 5
    strategy:
      fail-fast: false
      matrix:
        include:
          # `isolate` pins the dispatcher, which takes the highest available
          # tier, so isolating one means disabling exactly the tiers above it.
          # `ci/check_probe_matrix.py` derives that set from the tier order and
          # fails on any difference, here and in `probe-sweep.yml`. It matters
          # to a report as much as it did to a gate: an unpinned leg publishes
          # one tier's timings under another tier's name.
          #
          # Nothing else would. Under-pinning is silent and total — an SSE4.2
          # leg that forgot `memspan_disable_avx2` would time the AVX2 kernel
          # and publish it as SSE4.2 — and a *misspelt* flag is worse, because
          # a `--cfg` name is defined by being passed. `check-cfg` lints the
          # cfg names written in the source, not the ones handed to rustc:
          # `--cfg memspan_disable_avx22` was tried under `-Dwarnings` and
          # compiled clean.
          - tier: sse42
            cpu_flag: sse4_2
            isolate: --cfg memspan_disable_avx512 --cfg memspan_disable_avx2
          - tier: avx2
            cpu_flag: avx2
            isolate: --cfg memspan_disable_avx512
    steps:
      - uses: actions/checkout@v7
      - name: Cache cargo build and registry
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target-timing
          key: ${{ runner.os }}-probe-timing-${{ matrix.tier }}-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-probe-timing-${{ matrix.tier }}-
      - name: Install Rust
        run: rustup update stable && rustup default stable

      # Run before anything is measured, so a report whose absence checks
      # cannot fire is caught even on a run where the measurement never
      # happens.
      - name: Prove the timing report's absence checks bite
        run: python3 ci/report_probe_timing.py --selftest

      # Not a skip, and not a claim about which machine this is. `ubuntu-latest`
      # selects a generic hosted x64 VM; the flag is required because without it
      # the dispatcher would fall back below the tier this leg labels, so the
      # rows would be published under the wrong name. A leg that quietly stands
      # down when it cannot measure is the failure this repository already had
      # once, in probe-sweep.yml.
      #
      # The model is recorded rather than required: it is passed to the report
      # as `--host`, so every row says what ran it, and a reader can see whether
      # this run is comparable to the AMD EPYC 7763 the reference lines came
      # from.
      - name: Require the tier's CPU flag, and record the model
        shell: bash
        run: |
          if ! grep -qw "${{ matrix.cpu_flag }}" /proc/cpuinfo; then
            echo "::error::this runner reports no ${{ matrix.cpu_flag }}, so a ${{ matrix.tier }} row would name a tier this host cannot run"
            grep -m1 'model name' /proc/cpuinfo || true
            exit 1
          fi
          model=$(grep -m1 'model name' /proc/cpuinfo | cut -d: -f2- | xargs)
          echo "CPU: ${model}"
          echo "PROBE_TIMING_HOST=${model}" >> "$GITHUB_ENV"

      # `RUSTFLAGS` deliberately omits the workflow-level `-Dwarnings` — the
      # isolating cfgs make some backends dead code, and this job's business is
      # timing, not lint coverage, which `clippy --all-targets` already has.
      - name: Time the shipped width against the scalar loop
        shell: bash
        env:
          CARGO_TARGET_DIR: ${{ github.workspace }}/target-timing
          CRITERION_HOME: ${{ github.workspace }}/criterion-timing
          RUSTFLAGS: ${{ matrix.isolate }}
        run: |
          for round in $(seq 1 "$ROUNDS"); do
            echo "::group::round $round"
            cargo bench --bench short_run -- \
              --warm-up-time 1 --measurement-time 2 --sample-size 100 \
              --save-baseline "shipped_r${round}" \
              '^lexer_sweep/skip_ident(_start)?/(memspan|scalar)/'
            echo "::endgroup::"
          done

      # The reference lines are not restated here. The script derives them from
      # the observations it records, and a workflow copy could print a different
      # number than the one it documents.
      - name: Report the shipped width against the scalar loop
        shell: bash
        run: |
          python3 ci/report_probe_timing.py \
            --criterion-home "${{ github.workspace }}/criterion-timing" \
            --tier "${{ matrix.tier }}" \
            --host "$PROBE_TIMING_HOST" \
            --rounds "$ROUNDS" \
            | tee -a "$GITHUB_STEP_SUMMARY"

  # Apply clippy lints
  clippy:
    name: clippy
    strategy:
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
          - windows-latest
    runs-on: ${{ matrix.os }}
    steps:
    - uses: actions/checkout@v7
    - name: Install Rust
      # --no-self-update is necessary because the windows environment cannot self-update rustup.exe.
      run: rustup update stable --no-self-update && rustup default stable && rustup component add clippy
    - name: Install cargo-hack
      run: cargo install cargo-hack
    - name: Apply clippy lints
      # `--all-targets` is load-bearing. Without it the matrix lints the library
      # only, so `tests/` and `benches/` go unlinted however many feature
      # permutations run — which is how 32 diagnostics accumulated in them while
      # this job stayed green. `-D warnings` is repeated at the call site rather
      # than left to the workflow-level RUSTFLAGS so the gate's intent is legible
      # where the gate is.
      run: cargo hack clippy --each-feature --no-deps --all-targets -- -D warnings

  # Run tests on some extra platforms
  cross:
    name: cross
    strategy:
      matrix:
        target:
          - aarch64-unknown-linux-gnu
          - aarch64-linux-android
          - aarch64-unknown-linux-musl
          - i686-linux-android
          - x86_64-linux-android
          - i686-pc-windows-gnu
          - x86_64-pc-windows-gnu
          - i686-unknown-linux-gnu
          - powerpc64-unknown-linux-gnu
          - riscv64gc-unknown-linux-gnu
          - wasm32-unknown-unknown
          - wasm32-unknown-emscripten
          - wasm32-wasip1
          - wasm32-wasip1-threads
          - wasm32-wasip2
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Cache cargo build and registry
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cross-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cross-
      - name: Install Rust
        run: rustup update stable && rustup default stable
      - name: cargo build --target ${{ matrix.target }}
        run: |
          rustup target add ${{ matrix.target }}
          cargo build --target ${{ matrix.target }}

  build:
    name: build
    strategy:
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
          - windows-latest
    runs-on: ${{ matrix.os }}
    steps:
    - uses: actions/checkout@v7
    - name: Cache cargo build and registry
      uses: actions/cache@v6
      with:
        path: |
          ~/.cargo/registry
          ~/.cargo/git
          target
        key: ${{ runner.os }}-build-${{ hashFiles('**/Cargo.lock') }}
        restore-keys: |
          ${{ runner.os }}-build-
    - name: Install Rust
      # --no-self-update is necessary because the windows environment cannot self-update rustup.exe.
      run: rustup update stable --no-self-update && rustup default stable
    - name: Install cargo-hack
      run: cargo install cargo-hack
    - name: Run build
      run: cargo hack build --feature-powerset

  test:
    name: test
    strategy:
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
          - windows-latest
    runs-on: ${{ matrix.os }}
    steps:
    - uses: actions/checkout@v7
    - name: Cache cargo build and registry
      uses: actions/cache@v6
      with:
        path: |
          ~/.cargo/registry
          ~/.cargo/git
          target
        key: ${{ runner.os }}-test-${{ hashFiles('**/Cargo.lock') }}
        restore-keys: |
          ${{ runner.os }}-test-
    - name: Install Rust
      # --no-self-update is necessary because the windows environment cannot self-update rustup.exe.
      run: rustup update stable --no-self-update && rustup default stable
    - name: Install cargo-hack
      run: cargo install cargo-hack
    - name: Run test
      run: cargo hack test --feature-powerset

  # Run the x86_64 test suite under Intel SDE with Ice Lake (`-icx`)
  # emulation. The standard ubuntu-latest runner is AMD Milan (no
  # native AVX-512), so without SDE the AVX-512 kernel's
  # `is_x86_feature_detected!("avx512bw")` gate returns false and the
  # AVX-512 dispatch branch never executes. With SDE, `-icx` reports
  # AVX-512F/BW/DQ/VL via its CPUID intercept, so every x86 SIMD tier
  # (SSE4.2, AVX2, AVX-512BW) executes and is verified against the scalar
  # reference.
  #
  # SDE slowdown is ~5-10×, so the test suite runs in ~30-60s instead
  # of ~1s — still well within the free-runner budget.
  test-sde:
    name: test-sde-avx512
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Cache cargo build and registry
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-test-sde-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-test-sde-
      - name: Install Rust
        run: rustup update stable --no-self-update && rustup default stable
      - name: Install Intel SDE
        # No `sdeVersion:` on purpose — take the action's default.
        #
        # This job was green until 2026-07-14, when dependabot bumped the
        # action 4.0 -> 5.0 (#6). v4.0 accepted `9.33.0`; v5.0 dropped it,
        # accepting only 10.8.0 and 9.58.0, so the pinned input became
        # invalid and every run since has failed with
        # `SDE version '9.33.0' is not supported in this context.`
        # Dependabot bumps the dependency; it cannot know the configuration
        # has to move with it.
        #
        # Pinning any version here is a time bomb for a second reason the
        # action's own README gives: "Intel regularly removes older mirror
        # links". The default tracks whatever that action release supports,
        # so an action bump can no longer strand the input.
        uses: petarpetrovt/setup-sde@v6.0
        with:
          environmentVariableName: SDE_PATH
      - name: Run tests under SDE (-icx, Ice Lake AVX-512)
        # The `petarpetrovt/setup-sde` action exports `SDE_PATH` but
        # does not add the extracted directory to `PATH`, so `sde64`
        # isn't on PATH directly. Resolve the full path via shell
        # expansion before handing it to cargo as the runner.
        shell: bash
        run: |
          export CARGO_TARGET_X86_64_UNKNOWN_LINUX_GNU_RUNNER="$SDE_PATH/sde64 -icx --"
          cargo test --all-features

  # Run the wasm32 simd128 integration tests under wasmtime. The `cross`
  # job above only builds for wasm targets; without this job the simd128
  # backend's handcrafted swizzles and masks were dispatchable in
  # production (under `-C target-feature=+simd128`) but never
  # runtime-verified.
  #
  # `wasm32-wasip1` is the WASI preview-1 target (libstd + file/env APIs
  # that the test harness needs). Criterion is only in `[[bench]]` targets
  # so `cargo test --tests` does not pull it in.
  test-wasm-simd128:
    name: test-wasm-simd128
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Cache cargo build and registry
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-test-wasm-simd128-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-test-wasm-simd128-
      - name: Install Rust + wasm32-wasip1
        run: |
          rustup update stable --no-self-update
          rustup default stable
          rustup target add wasm32-wasip1
      - name: Install wasmtime
        run: |
          curl https://wasmtime.dev/install.sh -sSf | bash
          echo "$HOME/.wasmtime/bin" >> "$GITHUB_PATH"
      - name: Run integration tests under wasmtime (simd128)
        env:
          CARGO_TARGET_WASM32_WASIP1_RUNNER: wasmtime run --
          RUSTFLAGS: -C target-feature=+simd128
        run: cargo test --tests --target wasm32-wasip1

  sanitizer:
    name: sanitizer
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Cache cargo build and registry
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-sanitizer-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-sanitizer-
      - name: Install Rust
        run: rustup update nightly && rustup default nightly
      - name: Install rust-src
        run: rustup component add rust-src
      - name: ASAN / LSAN / MSAN / TSAN
        run: bash ci/sanitizer.sh

  miri-tb:
    name: miri-tb-${{ matrix.target }}
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - os: ubuntu-latest
            target: aarch64-unknown-linux-gnu
          - os: ubuntu-latest
            target: i686-unknown-linux-gnu
          - os: ubuntu-latest
            target: powerpc64-unknown-linux-gnu
          - os: ubuntu-latest
            target: s390x-unknown-linux-gnu
          - os: ubuntu-latest
            target: riscv64gc-unknown-linux-gnu
          - os: macos-latest
            target: aarch64-apple-darwin
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - name: Cache cargo build and registry
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-miri-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-miri-
      - name: Miri
        run: |
          bash ci/miri_tb.sh "${{ matrix.target }}"

  miri-sb:
    name: miri-sb-${{ matrix.target }}
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - os: ubuntu-latest
            target: aarch64-unknown-linux-gnu
          - os: ubuntu-latest
            target: i686-unknown-linux-gnu
          - os: ubuntu-latest
            target: powerpc64-unknown-linux-gnu
          - os: ubuntu-latest
            target: s390x-unknown-linux-gnu
          - os: ubuntu-latest
            target: riscv64gc-unknown-linux-gnu
          - os: macos-latest
            target: aarch64-apple-darwin
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - name: Cache cargo build and registry
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-miri-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-miri-
      - name: Miri
        run: |
          bash ci/miri_sb.sh "${{ matrix.target }}"
